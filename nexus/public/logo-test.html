<!DOCTYPE html>
<html>
<head><title>Nexus Logo Test</title></head>
<body style="margin:0;font-family:Inter,system-ui,sans-serif">

<!-- Row 1: On dark background -->
<div style="background:#0F172A;padding:60px;display:flex;gap:60px;align-items:center;justify-content:center">
  <div style="text-align:center">
    <h3 style="color:#94A3B8;margin-bottom:16px;font-size:13px;letter-spacing:1px">FULL COLOR + GLOW</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200">
      <defs>
        <linearGradient id="n1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#9333EA"/>
          <stop offset="25%" stop-color="#8B5CF6"/>
          <stop offset="50%" stop-color="#A855F7"/>
          <stop offset="75%" stop-color="#8B5CF6"/>
          <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
        <radialGradient id="g1" cx="256" cy="260" r="110" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#F5D0FE" stop-opacity="0.85"/>
          <stop offset="25%" stop-color="#E879F9" stop-opacity="0.5"/>
          <stop offset="55%" stop-color="#D946EF" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#C026D3" stop-opacity="0"/>
        </radialGradient>
        <filter id="gs1" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
        </filter>
      </defs>
      <ellipse cx="256" cy="260" rx="100" ry="85" fill="url(#g1)" filter="url(#gs1)"/>
      <path d="M 120 416 L 120 96 L 392 416 L 392 96" fill="none" stroke="url(#n1)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div style="text-align:center">
    <h3 style="color:#94A3B8;margin-bottom:16px;font-size:13px;letter-spacing:1px">FLAT PURPLE</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200">
      <path d="M 120 416 L 120 96 L 392 416 L 392 96" fill="none" stroke="#8B5CF6" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div style="text-align:center">
    <h3 style="color:#94A3B8;margin-bottom:16px;font-size:13px;letter-spacing:1px">WHITE</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200">
      <path d="M 120 416 L 120 96 L 392 416 L 392 96" fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<!-- Row 2: On white background -->

  <div style="text-align:center">
    <h3 style="color:#475569;margin-bottom:16px;font-size:13px;letter-spacing:1px">ON WHITE + GLOW</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200">
      <defs>
        <linearGradient id="n2" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">

  <div style="text-align:center">
    <h3 style="color:#475569;margin-bottom:16px;font-size:13px;letter-spacing:1px">FLAT ON WHITE</h3>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="200" height="200">

      </svg>
      <span style="font-size:36px;font-weight:700;color:#0F172A;letter-spacing:-0.5px">Nexus</span>

<!-- Row 4: Dark wordmark + app icon mockup -->
<div style="background:#0F172A;padding:60px;display:flex;gap:80px;align-items:center;justify-content:center">
  <div style="text-align:center">
    <h3 style="color:#94A3B8;margin-bottom:16px;font-size:13px;letter-spacing:1px">DARK WORDMARK</h3>
    <div style="display:flex;align-items:center;gap:14px">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="44" height="44">
        <defs>
          <linearGradient id="n5" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">

  <div style="text-align:center">
    <h3 style="color:#94A3B8;margin-bottom:16px;font-size:13px;letter-spacing:1px">APP ICON</h3>
    <div style="width:120px;height:120px;background:linear-gradient(135deg,#1E1B4B,#0F172A);border-radius:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(139,92,246,0.3)">
